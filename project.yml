# Dr. Nam H. Le. drnamlabs.com, bunnyquant.com
# App BunnyQuantVN (thị trường Việt Nam) viết bằng Swift thuần. Sinh project: `xcodegen` trong thư mục này (BunnyQuantVN.xcodeproj không vào git).
name: BunnyQuantVN
options:
  bundleIdPrefix: com.bunnyquant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9FX23J6S62
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    BQ_API_BASE: https://bunnyquant.vn
targets:
  BunnyQuantVN:
    type: application
    platform: iOS
    sources: [BunnyQuantVN]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bunnyquant.vn
        PRODUCT_NAME: BunnyQuantVN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BunnyQuantVN/Info.plist
        CODE_SIGN_ENTITLEMENTS: BunnyQuantVN/BunnyQuantVN.Release.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: BunnyQuantVN/BunnyQuantVN.Debug.entitlements
